<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>snap factory</title>
    <meta name="description" content="Farcaster snaps built by Snap Wizard" />
    <style>
      :root {
        color-scheme: dark light;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 480px;
        margin: 4rem auto;
        padding: 2rem 1.5rem;
        line-height: 1.5;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0.5rem 0;
        color: #666;
      }
      a {
        color: #00ac96;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      code {
        background: rgba(0, 172, 150, 0.08);
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <h1>snap factory</h1>
    <p>
      Farcaster snaps built by <strong>Snap Wizard</strong>. Two new snaps every day.
    </p>
    <p>Snaps live at <code>/snaps/[name]</code>.</p>
    <p>
      Source:
      <a href="https://github.com/mtple/snap-factory">github.com/mtple/snap-factory</a>
    </p>
  </body>
</html>
